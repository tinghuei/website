name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/festive-mccarthy-EA3xm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: le-lian-web/le-lian-industrial-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: le-lian-web/le-lian-industrial-web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: le-lian-web/le-lian-industrial-web
        run: pnpm exec vite build --config vite.config.local.ts --base /website/

      - name: Add SPA 404 fallback
        working-directory: le-lian-web/le-lian-industrial-web/dist/public
        run: cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: le-lian-web/le-lian-industrial-web/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
